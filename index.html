<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шиномонтаж</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 0;
  text-align: center;
}
header {
  background: #222;
  color: #fff;
  padding: 15px;
  font-size: 20px;
}
.container {
  max-width: 600px;
  margin: 20px auto;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
input, select, button {
  margin: 5px;
  padding: 10px;
  border-radius: 5px;
  border: 1px solid #aaa;
}
button {
  background: #222;
  color: #fff;
  cursor: pointer;
}
button:hover {
  background: #555;
}
#records {
  text-align: left;
  margin-top: 20px;
}
.hidden {
  display: none;
}
</style>
</head>
<body>

<header>Шиномонтаж — запись клиентов</header>

<div class="container">
  <div id="loginSection">
    <input type="password" id="password" placeholder="Пароль начальника">
    <button onclick="login()">Войти</button>
  </div>

  <div id="workerSection">
    <h3>Запись клиента</h3>
    <input id="name" placeholder="Имя клиента">
    <input id="phone" placeholder="Номер телефона">
    <input id="time" type="time">
    <select id="radius">
      <option>До 21</option>
      <option>Больше 21</option>
    </select>
    <select id="carType">
      <option>Легковой</option>
      <option>Кроссовер</option>
      <option>Коммерческий транспорт</option>
    </select>
    <select id="workType">
      <option>Замена шин</option>
      <option>Балансировка</option>
      <option>Ремонт прокола</option>
    </select>
    <button onclick="addRecord()">Добавить запись</button>
  </div>

  <div id="bossPanel" class="hidden">
    <h3>Панель начальника</h3>
    <button onclick="loadRecords()">Обновить записи</button>
    <div id="records"></div>
  </div>

  <div style="margin-top: 20px;">
    <p><b>График работы:</b> 8:00–17:00</p>
    <p><a href="https://t.me/yourtelegram" target="_blank">Наш Telegram</a></p>
    <p><a href="https://maps.app.goo.gl/G2bUdBGAhC3RuR9q8" target="_blank">Мы на карте</a></p>
  </div>
</div>

<script>
const BOSS_PASSWORD = "boss";

function login() {
  const pass = document.getElementById("password").value;
  if (pass === BOSS_PASSWORD) {
    document.getElementById("bossPanel").classList.remove("hidden");
    document.getElementById("workerSection").classList.add("hidden");
    document.getElementById("loginSection").classList.add("hidden");
    loadRecords();
  } else {
    alert("Неверный пароль!");
  }
}

function addRecord() {
  const record = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    time: document.getElementById("time").value,
    radius: document.getElementById("radius").value,
    carType: document.getElementById("carType").value,
    workType: document.getElementById("workType").value,
    date: new Date().toLocaleDateString()
  };

  fetch("/api/records.json")
    .then(r => r.json())
    .then(data => {
      data.push(record);
      return fetch("/api/records.json", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
    })
    .then(() => alert("Запись добавлена!"))
    .catch(() => alert("Ошибка сохранения"));
}

function loadRecords() {
  fetch("/api/records.json")
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById("records");
      container.innerHTML = "";
      data.forEach((r, i) => {
        container.innerHTML += `<p>${i+1}. ${r.name} — ${r.time} (${r.carType}, ${r.workType})</p>`;
      });
    });
}
</script>

</body>
</html>
