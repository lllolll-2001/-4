<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шиномонтаж</title>
<style>
:root{
  --bg:#121217;
  --card:#1f1f24;
  --accent:#ff3b3b;
  --text:#f5f5f5;
  --muted:#bbbbbb;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#0f0f14 0%, #15151a 100%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:24px auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
header h1{color:var(--accent);margin:0}
.card{background:var(--card);padding:14px;border-radius:10px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,0.45)}
input, select {width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#0f1114;color:var(--text)}
button{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
button:hover{opacity:.95}
.tg-button{display:inline-block;margin:4px 0;padding:6px 10px;background:#0088cc;color:#fff;border-radius:6px;text-decoration:none}
.records {margin-top:14px;}
.record {background:linear-gradient(180deg,#16161a,#111114);border:1px solid rgba(255,255,255,0.04);padding:10px;border-radius:8px;margin:8px 0;}
.map iframe {width:100%;height:300px;border-radius:8px;border:0;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Шиномонтаж</h1>
</header>

<!-- Форма клиента -->
<div class="card">
  <h2>Новая запись клиента</h2>
  <input type="text" id="clientName" placeholder="Имя">
  <select id="vehicleType">
    <option value="">Тип авто</option>
    <option value="Легковое">Легковое</option>
    <option value="Кроссовер">Кроссовер</option>
    <option value="Коммерческий транспорт">Коммерческий транспорт</option>
  </select>
  <select id="wheelRadius">
    <option value="">Радиус колеса</option>
    ${[13,14,15,16,17,18,19,20,21].map(r=>`<option value="${r}">${r}</option>`).join('')}
  </select>
  <input type="text" id="service" placeholder="Вид работы">
  <input type="date" id="serviceDate">
  <select id="serviceTime"></select>
  <button onclick="submitClientRecord()">Добавить запись</button>
</div>

<!-- Форма логина -->
<div class="card">
  <h2>Вход</h2>
  <input type="text" id="loginUsername" placeholder="Логин">
  <input type="password" id="loginPassword" placeholder="Пароль">
  <button onclick="login(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value)">Войти</button>
</div>

<!-- Список записей -->
<div class="card">
  <h2>Все записи</h2>
  <div id="recordsContainer" class="records"></div>
</div>

<!-- Панель начальника -->
<div class="card" id="earningsSection" style="display:none;">
  <h2>Заработок начальника</h2>
  <label>Показать прибыль: </label>
  <select id="earningPeriod" onchange="showEarnings()">
    <option value="day">Сегодня</option>
    <option value="week">Неделя</option>
    <option value="month">Месяц</option>
  </select>
  <div>Итого: <span id="earningsDisplay">0 грн</span></div>
</div>

<!-- Контакты -->
<div class="card" id="contactInfo">
  <h2>График работы</h2>
  <p>8:00 – 17:00</p>
  <a class="tg-button" href="https://t.me/VladyslavShunu" target="_blank">Наш Telegram</a>
  <p><a class="tg-button" href="https://maps.app.goo.gl/G2bUdBGAhC3RuR9q8" target="_blank">Мы на карте</a></p>
</div>

</div>

<script>
let currentUser = null;
let records = [];
const timeSelect = document.getElementById('serviceTime');

// Время
function fillTimeSlots() {
  timeSelect.innerHTML = '';
  for (let h=8; h<=16; h++) {
    timeSelect.innerHTML += `<option>${h}:00</option><option>${h}:50</option>`;
  }
}
fillTimeSlots();

// Минимальная дата
document.getElementById('serviceDate').min = new Date().toISOString().split('T')[0];

// Клиент
async function submitClientRecord() {
  const newRecord = {
    name: document.getElementById('clientName').value.trim(),
    vehicle: document.getElementById('vehicleType').value,
    radius: document.getElementById('wheelRadius').value,
    service: document.getElementById('service').value,
    date: document.getElementById('serviceDate').value,
    time: document.getElementById('serviceTime').value,
    createdBy:'client'
  };
  if(!newRecord.name || !newRecord.date || !newRecord.time) {alert('Заполните все поля'); return;}
  if(records.some(r=>r.date===newRecord.date && r.time===newRecord.time)){alert('Выбранное время занято');return;}
  await addRecord(newRecord);
}

// API
async function fetchRecords(){
  const res = await fetch('/api/records');
  records = await res.json();
  renderRecords();
  showEarnings();
}

async function addRecord(record){
  await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)});
  fetchRecords();
}

async function updateRecord(id,update){
  await fetch('/api/records',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,update})});
  fetchRecords();
}

// Логин
async function login(username,password){
  const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  if(res.status===200){
    const data = await res.json();
    currentUser=data.user;
    alert('Вход успешен');
    renderRecords();
    toggleEarningsSection();
  } else {alert('Неверный логин или пароль');}
}

// Отображение
function renderRecords(){
  const container=document.getElementById('recordsContainer');container.innerHTML='';
  records.forEach(r=>{
    const div=document.createElement('div');div.className='record';
    div.innerHTML=`<b>${r.name}</b> | ${r.vehicle || ''} | ${r.radius || ''} | ${r.service || ''} | ${r.date || ''} ${r.time || ''} <br>
    Создал: ${r.createdBy}`;
    if(currentUser && currentUser.role==='worker'){
      div.innerHTML+=`<br><button onclick="markStatus(${r.id},'Сделано')">Сделано</button>
        <button onclick="markStatus(${r.id},'Не приехал')">Не приехал</button>
        <button onclick="addWork(${r.id})">Добавить работу</button>`;
    }
    container.appendChild(div);
  });
}

// Работа
async function addWork(recordId=null){
  const workName=prompt('Что сделано?'); if(!workName)return;
  const sum=prompt('Сумма:'); if(!sum)return;
  const workRecord={name:workName,sum,date:new Date().toISOString().split('T')[0],createdBy:currentUser.username,linkedTo:recordId};
  await addRecord(workRecord);
}

async function markStatus(id,status){
  const sum=status==='Сделано'?prompt('Введите сумму за работу:'):undefined;
  await updateRecord(id,{status,sum});
}

// Начальник
function calculateEarnings(period='day'){
  if(!records || records.length===0)return 0;
  const now=new Date();
  let filtered=[];
  if(period==='day'){filtered=records.filter(r=>r.sum&&r.date===now.toISOString().split('T')[0]);}
  if(period==='week'){
    const startOfWeek=new Date(now); startOfWeek.setDate(now.getDate()-now.getDay());
    filtered=records.filter(r=>r.sum&&new Date(r.date)>=startOfWeek&&new Date(r.date)<=now);
  }
  if(period==='month'){
    const month=now.getMonth(),year=now.getFullYear();
    filtered=records.filter(r=>r.sum&&new Date(r.date).getMonth()===month&&new Date(r.date).getFullYear()===year);
  }
  return filtered.reduce((acc,r)=>acc+parseFloat(r.sum||0),0);
}

function showEarnings(){
  if(!currentUser||currentUser.role!=='boss')return;
  const period=document.getElementById('earningPeriod')?.value||'day';
  const total=calculateEarnings(period);
  const display=document.getElementById('earningsDisplay');
  if(display)display.innerText=total+' грн';
}

function toggleEarningsSection(){
  const section=document.getElementById('earningsSection');
  if(currentUser&&currentUser.role==='boss'){section.style.display='block';showEarnings();}
  else section.style.display='none';
}

// Инициализация
fetchRecords();
</script>

</body>
</html>
