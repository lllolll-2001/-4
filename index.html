<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Шиномонтаж</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>Шиномонтаж</h1>
  </header>

  <!-- Форма записи клиента -->
  <div class="card">
    <h2>Новая запись клиента</h2>
    <input type="text" id="clientName" placeholder="Имя">
    <select id="vehicleType">
      <option value="">Тип авто</option>
      <option value="легковое">Легковое</option>
      <option value="кроссовер">Кроссовер</option>
      <option value="коммерческий">Коммерческий транспорт</option>
    </select>
    <select id="wheelRadius">
      <option value="">Радиус колеса</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15">15</option>
      <option value="16">16</option>
      <option value="17">17</option>
      <option value="18">18</option>
      <option value="19">19</option>
      <option value="20">20</option>
      <option value="21">21</option>
    </select>
    <input type="text" id="service" placeholder="Услуга">
    <input type="date" id="serviceDate">
    <select id="serviceTime"></select>
    <button onclick="submitClientRecord()">Добавить запись</button>
  </div>

  <hr>

  <!-- Форма логина -->
  <div class="card">
    <h2>Вход</h2>
    <input type="text" id="loginUsername" placeholder="Логин">
    <input type="password" id="loginPassword" placeholder="Пароль">
    <button onclick="login(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value)">Войти</button>
  </div>

  <hr>

  <!-- Список записей -->
  <div class="records" id="recordsContainer"></div>

  <!-- Панель начальника -->
  <div class="card" id="earningsSection" style="display:none;">
    <h2>Заработок начальника</h2>
    <label>Показать прибыль:</label>
    <select id="earningPeriod" onchange="showEarnings()">
      <option value="day">Сегодня</option>
      <option value="week">Неделя</option>
      <option value="month">Месяц</option>
    </select>
    <div>Итого: <span id="earningsDisplay">0 грн</span></div>
  </div>

  <!-- Контакты -->
  <div class="card">
    <h2>График работы 8:00 – 17:00</h2>
    <a class="tg-button" href="https://t.me/VladyslavShunu" target="_blank">Наш Telegram</a>
    <p>Карта: <a href="https://maps.app.goo.gl/G2bUdBGAhC3RuR9q8" target="_blank">Мы на карте</a></p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
